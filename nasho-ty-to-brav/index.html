<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Bafazol Monk — Нашо ти то брав</title>
  <meta name="description" content="Bafazol Monk — Нашо ти то брав. Слухати на платформах." />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --content-width: min(86vw, 460px);
      --tile-gap: 4px;
    }

    html {
      min-height: 100%;
      background: #050505;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,0.08), transparent 34%),
        #050505;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 14px;
    }

    main {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .artist {
      margin: 0 0 4px;
      font-size: 26px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .track {
      margin: 0 0 20px;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 700;
    }

    .cover {
      display: block;
      width: var(--content-width);
      margin: 0 auto 16px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.75);
    }

    .platforms {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--tile-gap);
      width: var(--content-width);
      margin: 0 auto;
    }

    .platform-tile {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      text-decoration: none;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.12s ease, opacity 0.12s ease, border-color 0.12s ease;
    }

    .platform-tile:hover {
      transform: translateY(-2px);
      opacity: 0.9;
      border-color: rgba(255, 255, 255, 0.34);
    }

    .platform-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Орієнтуємось по ширині чорного знаку */
    .platform-logo {
      position: relative;
      z-index: 1;
      width: 42%;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
    }

    /* YouTube трохи ширший по природі, тому робимо його
       з тим самим принципом по ширині, а не по висоті */
    .platform-logo.youtube {
      width: 42%;
    }

    .platform-logo.apple {
      width: 42%;
    }

    .platform-logo.youtube-music {
      width: 42%;
    }

    .platform-logo.spotify {
      width: 42%;
    }

    .copyright {
      margin: 24px 0 0;
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.55;
    }

    @media (max-width: 480px) {
      :root {
        --content-width: min(92vw, 460px);
        --tile-gap: 3px;
      }

      body {
        padding: 22px 10px;
      }

      .artist {
        font-size: 22px;
      }

      .track {
        font-size: 20px;
        margin-bottom: 18px;
      }

      .cover {
        margin-bottom: 12px;
      }

      .copyright {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="artist">Bafazol Monk</p>
    <p class="track">Нашо ти то брав</p>

    <img class="cover" src="./cover.png" alt="Bafazol Monk — Нашо ти то брав cover" />

    <nav class="platforms" aria-label="Слухати на платформах">
      <!-- 1. Apple Music -->
      <a class="platform-tile" href="https://apple.co/4ehO8oa" target="_blank" rel="noopener noreferrer" aria-label="Apple Music">
        <img class="platform-bg" src="./bkg1.png" alt="" />
        <img class="platform-logo apple" src="./apple_music.svg" alt="Apple Music" />
      </a>

      <!-- 2. Spotify (поміняно місцями з YouTube) -->
      <a class="platform-tile" href="https://open.spotify.com/album/5XkwMvusfrCG1AkIAed16X" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
        <img class="platform-bg" src="./bkg3.png" alt="" />
        <img class="platform-logo spotify" src="./spotify.png" alt="Spotify" />
      </a>

      <!-- 3. YouTube Music -->
      <a class="platform-tile" href="https://music.youtube.com/playlist?list=OLAK5uy_kDbJtOXDCWgOO0ULXRG1am0sCeXLOSbpY" target="_blank" rel="noopener noreferrer" aria-label="YouTube Music">
        <img class="platform-bg" src="./bkg2.png" alt="" />
        <img class="platform-logo youtube-music" src="./youtube_music.png" alt="YouTube Music" />
      </a>

      <!-- 4. YouTube -->
      <a class="platform-tile" href="https://www.youtube.com/@bafazolmonk" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <img class="platform-bg" src="./bkg4.png" alt="" />
        <img class="platform-logo youtube" src="./youtube.png" alt="YouTube" />
      </a>
    </nav>

    <p class="copyright">© 2026 Bafazol Monk</p>
  </main>
</body>
</html>
